name: macOS AppleScript

on:
  push:
    branches: [main]
    paths:
      - "src/slicer_uri_bridge/manager.py"
      - "src/slicer_uri_bridge/resources/macos-dialog.applescript"
      - "src/slicer_uri_bridge/resources/macos-launcher.applescript"
      - "tests/test_manager_macos.py"
      - ".github/workflows/macos-applescript.yml"
  pull_request:
    paths:
      - "src/slicer_uri_bridge/manager.py"
      - "src/slicer_uri_bridge/resources/macos-dialog.applescript"
      - "src/slicer_uri_bridge/resources/macos-launcher.applescript"
      - "tests/test_manager_macos.py"
      - ".github/workflows/macos-applescript.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osacompile:
    name: osacompile integration
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install package
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Run macOS AppleScript tests
        run: python -m unittest tests.test_manager_macos tests.test_ui.MacOSDialogCompileTests
