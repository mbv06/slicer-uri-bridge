name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve release channel
        id: meta
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/v* ]]; then
            release_tag="$REF_NAME"
            release_name="$REF_NAME"
            if [[ "$release_tag" == *-* ]]; then
              prerelease=true
              make_latest=false
            else
              prerelease=false
              make_latest=true
            fi
          elif [[ "$EVENT" == workflow_dispatch && "$REF_NAME" == dev ]]; then
            release_tag=dev
            release_name=Dev
            prerelease=true
            make_latest=false
          else
            echo "Stable releases need a v* tag. Dev releases: run this workflow from the 'dev' branch." >&2
            exit 1
          fi
          if [[ ! "$release_tag" =~ ^(dev|v[0-9][0-9A-Za-z.-]*)$ ]]; then
            echo "Refusing unsafe release tag: $release_tag" >&2
            exit 1
          fi
          {
            echo "release_tag=$release_tag"
            echo "release_name=$release_name"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $release_name (tag=$release_tag, prerelease=$prerelease, make_latest=$make_latest)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if tag == "dev":
              print("Skipping version check for rolling dev release")
              raise SystemExit(0)
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^version = "([^"]+)"$', text)
          if match is None:
              raise SystemExit("Could not find version in pyproject.toml")
          version = match.group(1)
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"Tag {tag} does not match pyproject.toml version {expected}")
          print(f"Tag {tag} matches package version {version}")
          PY

      - name: Install package and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
          python -m unittest discover -s tests

      - name: Build Python install assets
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist
          sdist=$(find dist -name '*.tar.gz' | wc -l)
          if [ "$sdist" -ne 1 ]; then
            echo "Expected 1 sdist, found $sdist" >&2
            exit 1
          fi
          mv dist/*.tar.gz dist/slicer-uri-bridge-python.tar.gz
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          tar_path = Path("dist/slicer-uri-bridge-python.tar.gz")
          zip_path = Path("dist/slicer-uri-bridge-python.zip")
          with tarfile.open(tar_path, "r:*") as tf, zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
              lock_found = False
              for member in tf.getmembers():
                  if not member.isfile():
                      continue
                  extracted = tf.extractfile(member)
                  if extracted is None:
                      continue
                  zf.writestr(member.name, extracted.read())
                  if Path(member.name).name == "requirements.lock":
                      lock_found = True
          if not lock_found:
              raise SystemExit("sdist is missing requirements.lock")
          print(f"Wrote {zip_path}")
          PY

      - name: Verify Python install asset
        env:
          SMOKE_HOME: ${{ runner.temp }}/release-python-asset-smoke
          SMOKE_ZIP: ${{ runner.temp }}/release-python-zip
        run: |
          python -m venv "$SMOKE_HOME"
          "$SMOKE_HOME/bin/python" -m pip install --upgrade pip
          unzip -q dist/slicer-uri-bridge-python.zip -d "$SMOKE_ZIP"
          lock="$(find "$SMOKE_ZIP" -type f -name requirements.lock | awk '{ print length, $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$lock" ]; then
            echo "zip is missing requirements.lock" >&2
            exit 1
          fi
          root="$(dirname "$lock")"
          "$SMOKE_HOME/bin/python" -m pip install --require-hashes -r "$lock"
          "$SMOKE_HOME/bin/python" -m pip install --no-deps "$root"
          "$SMOKE_HOME/bin/slicer-uri-bridge" --version

      - name: Pin installers to this release
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          python - "$tag" <<'PY'
          import re
          import sys
          from pathlib import Path

          tag = sys.argv[1]
          if tag != "dev" and not re.fullmatch(r"v[0-9][0-9A-Za-z.-]*", tag):
              raise SystemExit(f"Refusing to pin installers to unsafe release tag: {tag}")
          replacements = {
              Path("install-windows.ps1"): ("$ReleaseTag = 'latest'", f"$ReleaseTag = '{tag}'"),
              Path("install-macos.sh"): ('RELEASE_TAG="latest"', f'RELEASE_TAG="{tag}"'),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Could not find {old!r} in {path}")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one {old!r} in {path}, found {text.count(old)}")
              path.write_text(text.replace(old, new), encoding="utf-8")
              print(f"Pinned {path} to {tag}")
          PY

      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: python tests/changelog_notes.py

      - name: Move rolling dev tag
        if: steps.meta.outputs.release_tag == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/dev" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/dev" \
              -f sha="${GITHUB_SHA}" \
              -F force=true
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/tags/dev' \
              -f sha="${GITHUB_SHA}"
          fi
          echo "refs/tags/dev -> ${GITHUB_SHA}"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          overwrite_files: true
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/slicer-uri-bridge-python.tar.gz
            dist/slicer-uri-bridge-python.zip
            install-windows.ps1
            install-macos.sh
